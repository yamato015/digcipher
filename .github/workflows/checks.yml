name: Validate static app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check data.js
      - name: Validate fixed database
        run: node scripts/check-data.cjs
      - name: Check search and provenance behavior
        run: node --test tests/*.test.cjs
